version: 1

project:
  title: Computational Methods for Scientists Fall 26
  authors:
    - name: Valeria Barra
  exclude:
    - .venv-jb2/**
    - README.md
    - grading-fall26/**
  github: sdsu-comp526/fall26
  thebe:
    binder:
      repo: sdsu-comp526/fall26
      provider: github
      ref: main
  bibliography:
    - references.bib
  exports:
  - format: pdf
    template: plain_latex_book
    output: exports/comp526_fall26_book.pdf
    articles:
      - file: syllabus.md
        level: 1 # for section

      - file: lectures.md
        level: 1 # for section

      - file: lectures/module1-1_first_class.ipynb
        level: 0 # for chapter

      - file: lectures/module1-2_linux.ipynb
        level: 0 # for chapter

      - file: lectures/module1-3_community_projects.md
        level: 0 # for chapter
  toc:
    - file: index.md
    - file: syllabus.md
    - file: lectures.md
      children:
        - file: lectures/module1-1_first_class.ipynb
        - file: lectures/module1-2_linux.ipynb
        - file: lectures/module1-3_community_projects.md

site:
  options:
    logo: img/SDSU-comp526_logo.svg
    favicon: img/favicon.ico
    folders: true
  template: book-theme
